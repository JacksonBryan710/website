<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Jackson Bryan</title>
        <!--
          Single Page Apps for GitHub Pages
          https://github.com/rafgraph/spa-github-pages

          GitHub Pages doesn't support server-side rewrites, so a hard refresh or
          direct link to a client-side route (e.g. /about) 404s. This script
          encodes the requested path into a query string and redirects to the
          root, where the script in index.html decodes it and restores the URL
          via history.replaceState before React Router takes over.
        -->
        <script>
            var pathSegmentsToKeep = 0;
            var l = window.location;
            l.replace(
                l.protocol +
                    '//' +
                    l.hostname +
                    (l.port ? ':' + l.port : '') +
                    l.pathname
                        .split('/')
                        .slice(0, 1 + pathSegmentsToKeep)
                        .join('/') +
                    '/?/' +
                    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                    l.hash
            );
        </script>
    </head>
    <body></body>
</html>
